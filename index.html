<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OW2 Hero Picker 2026</title>
    <style>
        :root { --ow-orange: #f99e1a; --ow-blue: #405275; --bg: #12141a; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .filter-btn { background: #2a2e38; color: #888; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin: 5px; font-weight: bold; }
        .filter-btn.active { background: var(--ow-blue); color: white; }
        .card { background: #22262e; width: 320px; margin: 20px auto; padding: 30px; border-radius: 20px; border-bottom: 6px solid var(--ow-orange); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .portrait-circle { width: 160px; height: 160px; margin: 0 auto 20px; background: #1a1c23; border-radius: 50%; border: 4px solid var(--ow-blue); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #hero-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        #placeholder { font-size: 4rem; color: var(--ow-orange); }
        #hero-name { font-size: 2.2rem; text-transform: uppercase; margin: 10px 0; font-weight: 800; }
        .role { color: var(--ow-orange); font-size: 0.8rem; letter-spacing: 2px; }
        .roll-btn { background: var(--ow-orange); color: white; border: none; width: 320px; padding: 20px; border-radius: 12px; font-size: 1.5rem; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #b36e00; }
        .roll-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b36e00; }
    </style>
</head>
<body>

    <h1>Hero Picker</h1>

    <div id="filters">
        <button class="filter-btn active" type="button" onclick="setRole('all', this)">ALL</button>
        <button class="filter-btn" type="button" onclick="setRole('tank', this)">TANK</button>
        <button class="filter-btn" type="button" onclick="setRole('damage', this)">DPS</button>
        <button class="filter-btn" type="button" onclick="setRole('support', this)">SUPP</button>
    </div>

    <div class="card">
        <div class="portrait-circle">
            <div id="placeholder">?</div>
            <img id="hero-img" src="" referrerpolicy="no-referrer" alt="Hero portrait">
        </div>
        <div class="role" id="hero-role">CHOOSE YOUR ROLE</div>
        <div id="hero-name">READY?</div>
    </div>

    <button class="roll-btn" type="button" onclick="roll()">ROLL HERO</button>

<script>
    const heroes = [
        // 2026 NEW HEROES
        { name: "Domina", role: "tank", id: "domina" },
        { name: "Anran", role: "damage", id: "anran" },
        { name: "Emre", role: "damage", id: "emre" },
        { name: "Jetpack Cat", role: "support", id: "jetpack-cat" },
        { name: "Mizuki", role: "support", id: "mizuki" },
        { name: "Hazard", role: "tank", id: "hazard" },
        // CLASSIC ROSTER (Shortened for speed)
        { name: "D.Va", role: "tank", id: "dva" }, { name: "Reinhardt", role: "tank", id: "reinhardt" },
        { name: "Genji", role: "damage", id: "genji" }, { name: "Tracer", role: "damage", id: "tracer" },
        { name: "Kiriko", role: "support", id: "kiriko" }, { name: "Mercy", role: "support", id: "mercy" },
        { name: "Ana", role: "support", id: "ana" }, { name: "Juno", role: "support", id: "juno" }
    ];

    let currentRole = 'all';

    function setRole(role, btn) {
        currentRole = role;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function roll() {
        const pool = currentRole === 'all' ? heroes : heroes.filter(h => h.role === currentRole);
        const choice = pool[Math.floor(Math.random() * pool.length)];

        const img = document.getElementById('hero-img');
        const placeholder = document.getElementById('placeholder');
        
        document.getElementById('hero-name').innerText = choice.name;
        document.getElementById('hero-role').innerText = choice.role.toUpperCase();

        img.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.innerText = "...";

        // Use the official Blizzard CDN with the no-referrer fix
        img.src = `https://d15f34w2p8l1cc.cloudfront.net/overwatch/static/hero/${choice.id}/icon-portrait.png`;

        img.onload = () => {
            img.style.display = 'block';
            placeholder.style.display = 'none';
        };

        img.onerror = () => {
            img.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.innerText = choice.name[0];
        };
    }
</script>
</body>
</html>

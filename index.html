<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OW2 Hero Picker 2026</title>
    <style>
        :root { --ow-orange: #f99e1a; --ow-blue: #405275; --bg: #12141a; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .filter-btn { background: #2a2e38; color: #888; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin: 5px; font-weight: bold; }
        .filter-btn.active { background: var(--ow-blue); color: white; }
        .card { background: #22262e; width: 320px; margin: 20px auto; padding: 30px; border-radius: 20px; border-bottom: 6px solid var(--ow-orange); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .portrait-circle { width: 160px; height: 160px; margin: 0 auto 20px; background: #1a1c23; border-radius: 50%; border: 4px solid var(--ow-blue); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #hero-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        #placeholder { font-size: 4rem; color: var(--ow-orange); }
        #hero-name { font-size: 2.2rem; text-transform: uppercase; margin: 10px 0; font-weight: 800; }
        .role { color: var(--ow-orange); font-size: 0.8rem; letter-spacing: 2px; }
        .roll-btn { background: var(--ow-orange); color: white; border: none; width: 320px; padding: 20px; border-radius: 12px; font-size: 1.5rem; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #b36e00; }
        .roll-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b36e00; }
    </style>
</head>
<body>

    <h1>Hero Picker</h1>

    <div id="filters">
        <button class="filter-btn active" type="button" onclick="setRole('all', this)">ALL</button>
        <button class="filter-btn" type="button" onclick="setRole('tank', this)">TANK</button>
        <button class="filter-btn" type="button" onclick="setRole('damage', this)">DPS</button>
        <button class="filter-btn" type="button" onclick="setRole('support', this)">SUPP</button>
    </div>

    <div class="card">
        <div class="portrait-circle">
            <div id="placeholder">?</div>
            <img id="hero-img" src="" referrerpolicy="no-referrer" alt="Hero portrait">
        </div>
        <div class="role" id="hero-role">CHOOSE YOUR ROLE</div>
        <div id="hero-name">READY?</div>
    </div>

    <button class="roll-btn" type="button" onclick="roll()">ROLL HERO</button>

<script>
    const heroes = [
        // --- TANKS ---
        { name: "D.Va", role: "tank", id: "dva" },
        { name: "Doomfist", role: "tank", id: "doomfist" },
        { name: "Hazard", role: "tank", id: "hazard" },
        { name: "Domina", role: "tank", id: "domina" }, // 2026 Release
        { name: "Junker Queen", role: "tank", id: "junker-queen" },
        { name: "Mauga", role: "tank", id: "mauga" },
        { name: "Orisa", role: "tank", id: "orisa" },
        { name: "Ramattra", role: "tank", id: "ramattra" },
        { name: "Reinhardt", role: "tank", id: "reinhardt" },
        { name: "Roadhog", role: "tank", id: "roadhog" },
        { name: "Sigma", role: "tank", id: "sigma" },
        { name: "Winston", role: "tank", id: "winston" },
        { name: "Wrecking Ball", role: "tank", id: "wrecking-ball" },
        { name: "Zarya", role: "tank", id: "zarya" },

        // --- DAMAGE ---
        { name: "Anran", role: "damage", id: "anran" }, // 2025/26 Release
        { name: "Ashe", role: "damage", id: "ashe" },
        { name: "Bastion", role: "damage", id: "bastion" },
        { name: "Cassidy", role: "damage", id: "cassidy" },
        { name: "Echo", role: "damage", id: "echo" },
        { name: "Emre", role: "damage", id: "emre" }, // 2026 Release
        { name: "Genji", role: "damage", id: "genji" },
        { name: "Hanzo", role: "damage", id: "hanzo" },
        { name: "Junkrat", role: "damage", id: "junkrat" },
        { name: "Mei", role: "damage", id: "mei" },
        { name: "Pharah", role: "damage", id: "pharah" },
        { name: "Reaper", role: "damage", id: "reaper" },
        { name: "Sojourn", role: "damage", id: "sojourn" },
        { name: "Soldier: 76", role: "damage", id: "soldier-76" },
        { name: "Sombra", role: "damage", id: "sombra" },
        { name: "Symmetra", role: "damage", id: "symmetra" },
        { name: "Torbjörn", role: "damage", id: "torbjorn" },
        { name: "Tracer", role: "damage", id: "tracer" },
        { name: "Venture", role: "damage", id: "venture" },
        { name: "Widowmaker", role: "damage", id: "widowmaker" },

        // --- SUPPORT ---
        { name: "Ana", role: "support", id: "ana" },
        { name: "Baptiste", role: "support", id: "baptiste" },
        { name: "Brigitte", role: "support", id: "brigitte" },
        { name: "Illari", role: "support", id: "illari" },
        { name: "Jetpack Cat", role: "support", id: "jetpack-cat" }, // 2026 Release
        { name: "Juno", role: "support", id: "juno" },
        { name: "Kiriko", role: "support", id: "kiriko" },
        { name: "Lifeweaver", role: "support", id: "lifeweaver" },
        { name: "Lúcio", role: "support", id: "lucio" },
        { name: "Mercy", role: "support", id: "mercy" },
        { name: "Mizuki", role: "support", id: "mizuki" }, // 2025 Release
        { name: "Moira", role: "support", id: "moira" },
        { name: "Zenyatta", role: "support", id: "zenyatta" }
    ];

    let currentRole = 'all';

    function setRole(role, btn) {
        currentRole = role;
        // Update button UI
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function roll() {
        // Filter based on selected role
        const pool = currentRole === 'all' ? heroes : heroes.filter(h => h.role === currentRole);
        const choice = pool[Math.floor(Math.random() * pool.length)];

        const img = document.getElementById('hero-img');
        const placeholder = document.getElementById('placeholder');
        
        // Update Text Info
        document.getElementById('hero-name').innerText = choice.name;
        document.getElementById('hero-role').innerText = choice.role.toUpperCase();

        // Loading State
        img.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.innerText = "...";

        // Image Path Logic
        // Note: We use icon-portrait.png for the best card-style fit
        img.src = `https://d15f34w2p8l1cc.cloudfront.net/overwatch/static/hero/${choice.id}/icon-portrait.png`;

        img.onload = () => {
            img.style.display = 'block';
            placeholder.style.display = 'none';
        };

        img.onerror = () => {
            img.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.innerText = choice.name[0];
            console.warn("Portrait missing for " + choice.name);
        };
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OW Hero Picker</title>
    <style>
        :root {
            --ow-orange: #f99e1a;
            --ow-blue: #405275;
            --bg-dark: #12141a;
            --card-bg: #22262e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--ow-orange); font-style: italic; text-transform: uppercase; margin-bottom: 20px; }

        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #2a2e38;
            padding: 5px;
            border-radius: 10px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .filter-btn.active {
            background: var(--ow-blue);
            color: white;
        }

        .card {
            background: var(--card-bg);
            width: 300px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-bottom: 5px solid var(--ow-orange);
            margin-bottom: 20px;
        }

        .portrait-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
            background: #1a1c23;
            border-radius: 50%;
            border: 4px solid var(--ow-blue);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder {
            font-size: 3rem;
            color: var(--ow-orange);
            font-weight: bold;
        }

        #hero-name {
            font-size: 2.2rem;
            margin: 10px 0;
            text-transform: uppercase;
        }

        .role-badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--ow-orange);
        }

        .random-btn {
            background: var(--ow-orange);
            border: none;
            color: white;
            width: 300px;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #b36e00;
        }

        .random-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b36e00;
        }
    </style>
</head>
<body>

    <h1>Hero Picker</h1>

    <div class="filter-container">
        <button type="button" class="filter-btn active" onclick="setFilter('All', this)">ALL</button>
        <button type="button" class="filter-btn" onclick="setFilter('tank', this)">TANK</button>
        <button type="button" class="filter-btn" onclick="setFilter('damage', this)">DPS</button>
        <button type="button" class="filter-btn" onclick="setFilter('support', this)">SUPP</button>
    </div>

    <div class="card">
        <div class="portrait-container">
            <div id="placeholder" class="placeholder">?</div>
            <img id="hero-img" src="" alt="">
        </div>
        <div class="role-badge" id="hero-role">READY?</div>
        <div id="hero-name">ROLL START</div>
    </div>

    <button type="button" class="random-btn" onclick="pickHero()">ROLL HERO</button>

<script>
    // IDs must be lowercase and match the Overfast API naming convention
    const heroes = [
        { name: "D.Va", role: "tank", id: "dva" },
        { name: "Doomfist", role: "tank", id: "doomfist" },
        { name: "Junker Queen", role: "tank", id: "junker-queen" },
        { name: "Mauga", role: "tank", id: "mauga" },
        { name: "Orisa", role: "tank", id: "orisa" },
        { name: "Ramattra", role: "tank", id: "ramattra" },
        { name: "Reinhardt", role: "tank", id: "reinhardt" },
        { name: "Roadhog", role: "tank", id: "roadhog" },
        { name: "Sigma", role: "tank", id: "sigma" },
        { name: "Winston", role: "tank", id: "winston" },
        { name: "Wrecking Ball", role: "tank", id: "wrecking-ball" },
        { name: "Zarya", role: "tank", id: "zarya" },
        { name: "Ashe", role: "damage", id: "ashe" },
        { name: "Bastion", role: "damage", id: "bastion" },
        { name: "Cassidy", role: "damage", id: "cassidy" },
        { name: "Echo", role: "damage", id: "echo" },
        { name: "Genji", role: "damage", id: "genji" },
        { name: "Hanzo", role: "damage", id: "hanzo" },
        { name: "Junkrat", role: "damage", id: "junkrat" },
        { name: "Mei", role: "damage", id: "mei" },
        { name: "Pharah", role: "damage", id: "pharah" },
        { name: "Reaper", role: "damage", id: "reaper" },
        { name: "Sojourn", role: "damage", id: "sojourn" },
        { name: "Soldier: 76", role: "damage", id: "soldier-76" },
        { name: "Sombra", role: "damage", id: "sombra" },
        { name: "Symmetra", role: "damage", id: "symmetra" },
        { name: "Torbjörn", role: "damage", id: "torbjorn" },
        { name: "Tracer", role: "damage", id: "tracer" },
        { name: "Widowmaker", role: "damage", id: "widowmaker" },
        { name: "Ana", role: "support", id: "ana" },
        { name: "Baptiste", role: "support", id: "baptiste" },
        { name: "Brigitte", role: "support", id: "brigitte" },
        { name: "Illari", role: "support", id: "illari" },
        { name: "Juno", role: "support", id: "juno" },
        { name: "Kiriko", role: "support", id: "kiriko" },
        { name: "Lifeweaver", role: "support", id: "lifeweaver" },
        { name: "Lúcio", role: "support", id: "lucio" },
        { name: "Mercy", role: "support", id: "mercy" },
        { name: "Moira", role: "support", id: "moira" },
        { name: "Zenyatta", role: "support", id: "zenyatta" }
    ];

    let currentFilter = 'All';

    function setFilter(role, btn) {
        currentFilter = role;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function pickHero() {
        const filtered = currentFilter === 'All' ? heroes : heroes.filter(h => h.role === currentFilter);
        const hero = filtered[Math.floor(Math.random() * filtered.length)];
        
        const img = document.getElementById('hero-img');
        const placeholder = document.getElementById('placeholder');
        
        document.getElementById('hero-name').innerText = hero.name;
        document.getElementById('hero-role').innerText = hero.role.toUpperCase();

        img.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.innerText = "...";

        // NEW ASSET SOURCE: Overfast API assets are public and don't block referrers
        img.src = `https://raw.githubusercontent.com/manon-vanden-bosch/overfast-api/master/assets/heroes/${hero.id}/portrait.png`;
        
        img.onload = () => {
            img.style.display = 'block';
            placeholder.style.display = 'none';
        };

        img.onerror = () => {
            img.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.innerText = hero.name[0];
        };
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OW Hero Picker 2026</title>
    <style>
        :root {
            --ow-orange: #f99e1a;
            --ow-blue: #405275;
            --bg-dark: #12141a;
            --card-bg: #22262e;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { 
            color: var(--ow-orange); 
            font-style: italic; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0 20px 0;
        }

        /* Role Filter Buttons */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #2a2e38;
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--ow-blue);
            color: white;
        }

        /* Hero Display Card */
        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 320px;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border-bottom: 6px solid var(--ow-orange);
            margin-bottom: 30px;
            transition: transform 0.1s ease;
        }

        .portrait-outer {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #2a2e38 0%, #1a1c23 100%);
            border-radius: 50%;
            border: 4px solid var(--ow-blue);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Only show once loaded */
        }

        #placeholder {
            font-size: 3rem;
            font-weight: 900;
            color: var(--ow-orange);
            text-shadow: 0 0 10px rgba(249, 158, 26, 0.3);
        }

        #hero-name {
            font-size: 2.2rem;
            margin: 10px 0;
            text-transform: uppercase;
            font-weight: 800;
        }

        .role-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(0,0,0,0.4);
            border-radius: 50px;
            font-size: 0.75rem;
            color: var(--ow-orange);
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Roll Action Button */
        .random-btn {
            background: var(--ow-orange);
            border: none;
            color: white;
            width: 100%;
            max-width: 320px;
            padding: 22px;
            border-radius: 16px;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #b36e00;
            transition: all 0.1s;
        }

        .random-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b36e00;
        }
    </style>
</head>
<body>

    <h1>Hero Picker</h1>

    <div class="filter-container">
        <button type="button" class="filter-btn active" onclick="updateFilter('All', this)">All</button>
        <button type="button" class="filter-btn" onclick="updateFilter('Tank', this)">Tank</button>
        <button type="button" class="filter-btn" onclick="updateFilter('Damage', this)">DPS</button>
        <button type="button" class="filter-btn" onclick="updateFilter('Support', this)">Supp</button>
    </div>

    <div class="card" id="heroCard">
        <div class="portrait-outer">
            <div id="placeholder">?</div>
            <img id="hero-img" alt="Hero" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=">
        </div>
        <div class="role-badge" id="hero-role">READY?</div>
        <div id="hero-name">ROLL START</div>
    </div>

    <button class="random-btn" type="button" onclick="rollHero()">ROLL HERO</button>

<script>
    const heroes = [
        // TANKS
        { name: "D.Va", role: "Tank", id: "dva" }, { name: "Doomfist", role: "Tank", id: "doomfist" },
        { name: "Hazard", role: "Tank", id: "hazard" }, { name: "Junker Queen", role: "Tank", id: "junker-queen" },
        { name: "Mauga", role: "Tank", id: "mauga" }, { name: "Orisa", role: "Tank", id: "orisa" },
        { name: "Ramattra", role: "Tank", id: "ramattra" }, { name: "Reinhardt", role: "Tank", id: "reinhardt" },
        { name: "Roadhog", role: "Tank", id: "roadhog" }, { name: "Sigma", role: "Tank", id: "sigma" },
        { name: "Winston", role: "Tank", id: "winston" }, { name: "Wrecking Ball", role: "Tank", id: "wrecking-ball" },
        { name: "Zarya", role: "Tank", id: "zarya" },

        // DAMAGE
        { name: "Ashe", role: "Damage", id: "ashe" }, { name: "Bastion", role: "Damage", id: "bastion" },
        { name: "Cassidy", role: "Damage", id: "cassidy" }, { name: "Echo", role: "Damage", id: "echo" },
        { name: "Genji", role: "Damage", id: "genji" }, { name: "Hanzo", role: "Damage", id: "hanzo" },
        { name: "Junkrat", role: "Damage", id: "junkrat" }, { name: "Mei", role: "Damage", id: "mei" },
        { name: "Pharah", role: "Damage", id: "pharah" }, { name: "Reaper", role: "Damage", id: "reaper" },
        { name: "Sojourn", role: "Damage", id: "sojourn" }, { name: "Soldier: 76", role: "Damage", id: "soldier-76" },
        { name: "Sombra", role: "Damage", id: "sombra" }, { name: "Symmetra", role: "Damage", id: "symmetra" },
        { name: "Torbjörn", role: "Damage", id: "torbjorn" }, { name: "Tracer", role: "Damage", id: "tracer" },
        { name: "Venture", role: "Damage", id: "venture" }, { name: "Widowmaker", role: "Damage", id: "widowmaker" },

        // SUPPORT
        { name: "Ana", role: "Support", id: "ana" }, { name: "Baptiste", role: "Support", id: "baptiste" },
        { name: "Brigitte", role: "Support", id: "brigitte" }, { name: "Illari", role: "Support", id: "illari" },
        { name: "Juno", role: "Support", id: "juno" }, { name: "Kiriko", role: "Support", id: "kiriko" },
        { name: "Lifeweaver", role: "Support", id: "lifeweaver" }, { name: "Lúcio", role: "Support", id: "lucio" },
        { name: "Mercy", role: "Support", id: "mercy" }, { name: "Moira", role: "Support", id: "moira" },
        { name: "Zenyatta", role: "Support", id: "zenyatta" }
    ];

    let currentRole = 'All';

    function updateFilter(role, btn) {
        currentRole = role;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function rollHero() {
        // Filter pool
        const pool = currentRole === 'All' ? heroes : heroes.filter(h => h.role === currentRole);
        const choice = pool[Math.floor(Math.random() * pool.length)];

        // Select elements
        const nameEl = document.getElementById('hero-name');
        const roleEl = document.getElementById('hero-role');
        const imgEl = document.getElementById('hero-img');
        const placeholderEl = document.getElementById('placeholder');
        const cardEl = document.getElementById('heroCard');

        // Update Text
        nameEl.innerText = choice.name;
        roleEl.innerText = choice.role.toUpperCase();

        // Loading state
        imgEl.style.display = 'none';
        placeholderEl.style.display = 'block';
        placeholderEl.innerText = "...";

        // Fetch via CORS Proxy to avoid being blocked by Blizzard's CDN security
        const blizzardUrl = `https://d15f34w2p8l1cc.cloudfront.net/overwatch/static/hero/${choice.id}/icon-portrait.png`;
        imgEl.src = `https://corsproxy.io/?${encodeURIComponent(blizzardUrl)}`;

        imgEl.onload = () => {
            imgEl.style.display = 'block';
            placeholderEl.style.display = 'none';
        };

        imgEl.onerror = () => {
            imgEl.style.display = 'none';
            placeholderEl.style.display = 'block';
            placeholderEl.innerText = choice.name[0]; // Shows "D" for D.Va, etc.
        };

        // Little visual bounce
        cardEl.style.transform = "scale(1.03)";
        setTimeout(() => cardEl.style.transform = "scale(1)", 100);
    }
</script>
</body>
</html>

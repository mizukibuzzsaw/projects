<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miki's OW Picker</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:,">

    <style>
        :root { 
            --ow-orange: #f99e1a; 
            --dark-bg: #1a1c21; 
        }
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: var(--dark-bg); 
            color: white; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        .role-container { display: flex; gap: 8px; margin-bottom: 30px; }
        .role-btn { padding: 12px; border: 2px solid #444; background: none; color: white; border-radius: 6px; cursor: pointer; }
        .role-btn.active { border-color: var(--ow-orange); background: var(--ow-orange); }
        #hero-display { font-size: 3rem; margin: 40px 0; font-weight: 900; font-style: italic; text-shadow: 2px 2px var(--ow-orange); }
        #roll-btn { padding: 15px 40px; font-size: 1.2rem; background: white; color: black; border: none; font-weight: 900; cursor: pointer; }
        #roll-btn:disabled { background: #444; color: #888; }
        #status { font-size: 0.8rem; color: #777; margin-bottom: 20px; }
        .history-list { list-style: none; padding: 0; color: #555; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>PRACTICE PICKER</h2>
    <div id="status">INITIALIZING...</div>

    <div class="role-container">
        <button type="button" class="role-btn active" onclick="setRole('all', this)">ALL</button>
        <button type="button" class="role-btn" onclick="setRole('tank', this)">TANK</button>
        <button type="button" class="role-btn" onclick="setRole('damage', this)">DPS</button>
        <button type="button" class="role-btn" onclick="setRole('support', this)">SUPP</button>
    </div>

    <div id="hero-display">READY</div>
    <button type="button" id="roll-btn" onclick="pickHero()" disabled>ROLL HERO</button>

    <ul class="history-list" id="history-list"></ul>

    <script>
        const BATTLE_TAG = "BottleCaps-11122"; 
        let currentRole = 'all';
        let heroData = [];

        const heroRoles = {
            tank: ["dva", "doomfist", "junker-queen", "mauga", "orisa", "ramattra", "reinhardt", "roadhog", "sigma", "winston", "wrecking-ball", "zarya", "hazard", "domina"],
            damage: ["ashe", "bastion", "cassidy", "echo", "genji", "hanzo", "junkrat", "mei", "pharah", "reaper", "sojourn", "soldier-76", "sombra", "symmetra", "torbjorn", "tracer", "widowmaker", "venture", "vendetta", "freja", "anran", "emre"],
            support: ["ana", "baptiste", "brigitte", "illari", "juno", "kiriko", "lifeweaver", "lucio", "mercy", "moira", "zenyatta", "wuyang", "mizuki"]
        };

        async function loadStats() {
            const statusEl = document.getElementById('status');
            try {
                // Use your backend as a proxy to avoid CORS issues
                const apiUrl = `/api/owstats/${BATTLE_TAG}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                heroData = Object.entries(data?.heroes_comparisons?.time_played || {}).map(([hero, value]) => ({ hero, value }));

                if (heroData.length === 0) {
                    statusEl.innerText = "CHECK PROFILE PRIVACY (MUST BE PUBLIC)";
                } else {
                    statusEl.innerText = `READY: ${BATTLE_TAG}`;
                    document.getElementById('roll-btn').disabled = false;
                }
            } catch (e) {
                statusEl.innerText = "ERROR 429: WAIT 5 MINUTES AND REFRESH";
                console.error(e);
            }
        }

        function setRole(role, btn) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function pickHero() {
            if (heroData.length === 0) return;
            let filtered = (currentRole === 'all') ? [...heroData] : heroData.filter(h => heroRoles[currentRole]?.includes(h.hero));
            
            const maxSec = Math.max(...filtered.map(h => h.value));
            const buffer = maxSec * 0.1 || 60;

            const weighted = filtered.map(h => ({
                name: h.hero.replace(/-/g, ' ').toUpperCase(),
                weight: (maxSec - h.value) + buffer
            }));

            const totalWeight = weighted.reduce((s, h) => s + h.weight, 0);
            let random = Math.random() * totalWeight;

            for (let h of weighted) {
                if (random < h.weight) {
                    document.getElementById('hero-display').innerText = h.name;
                    updateHistory(h.name);
                    return;
                }
                random -= h.weight;
            }
        }

        function updateHistory(name) {
            const li = document.createElement('li');
            li.innerText = name;
            const list = document.getElementById('history-list');
            list.prepend(li);
            if (list.children.length > 5) list.lastChild.remove();
        }

        loadStats();
    </script>
</body>
</html>

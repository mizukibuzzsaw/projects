<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OW Hero Picker</title>
    <style>
        :root {
            --ow-orange: #f99e1a;
            --ow-blue: #405275;
            --bg-dark: #12141a;
            --card-bg: #22262e;
        }

        body {
            font-family: 'Segoe UI', sans-serif, Arial;
            background: var(--bg-dark);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--ow-orange); font-style: italic; letter-spacing: 1px; margin-bottom: 10px; }

        .filter-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #2a2e38;
            padding: 5px;
            border-radius: 10px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .filter-btn.active {
            background: var(--ow-blue);
            color: white;
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 350px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-bottom: 5px solid var(--ow-orange);
            margin-bottom: 25px;
        }

        .portrait-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
            background: #1a1c23;
            border-radius: 50%;
            border: 4px solid var(--ow-blue);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Hidden until loaded */
        }

        .placeholder {
            font-size: 2.5rem;
            color: var(--ow-orange);
            font-weight: bold;
        }

        #hero-name {
            font-size: 2.2rem;
            margin: 10px 0;
            text-transform: uppercase;
        }

        .role-badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--ow-orange);
            letter-spacing: 1px;
        }

        .random-btn {
            background: var(--ow-orange);
            border: none;
            color: white;
            width: 90%;
            max-width: 350px;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #b36e00;
        }

        .random-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b36e00;
        }
    </style>
</head>
<body>

    <h1>HERO PICKER</h1>

    <div class="filter-container">
        <button type="button" class="filter-btn active" onclick="setFilter('All', this)">ALL</button>
        <button type="button" class="filter-btn" onclick="setFilter('Tank', this)">TANK</button>
        <button type="button" class="filter-btn" onclick="setFilter('Damage', this)">DPS</button>
        <button type="button" class="filter-btn" onclick="setFilter('Support', this)">SUPP</button>
    </div>

    <div class="card">
        <div class="portrait-container">
            <div id="placeholder" class="placeholder">?</div>
            <img id="hero-img" src="about:blank" alt="Hero Portrait">
        </div>
        <div class="role-badge" id="hero-role">READY?</div>
        <div id="hero-name">ROLL START</div>
    </div>

    <button type="button" class="random-btn" onclick="pickHero()">ROLL HERO</button>

<script>
    const heroes = [
        { name: "D.Va", role: "Tank", id: "dva" }, { name: "Doomfist", role: "Tank", id: "doomfist" },
        { name: "Junker Queen", role: "Tank", id: "junker-queen" }, { name: "Mauga", role: "Tank", id: "mauga" },
        { name: "Orisa", role: "Tank", id: "orisa" }, { name: "Ramattra", role: "Tank", id: "ramattra" },
        { name: "Reinhardt", role: "Tank", id: "reinhardt" }, { name: "Roadhog", role: "Tank", id: "roadhog" },
        { name: "Sigma", role: "Tank", id: "sigma" }, { name: "Winston", role: "Tank", id: "winston" },
        { name: "Wrecking Ball", role: "Tank", id: "wrecking-ball" }, { name: "Zarya", role: "Tank", id: "zarya" },
        { name: "Ashe", role: "Damage", id: "ashe" }, { name: "Bastion", role: "Damage", id: "bastion" },
        { name: "Cassidy", role: "Damage", id: "cassidy" }, { name: "Echo", role: "Damage", id: "echo" },
        { name: "Genji", role: "Damage", id: "genji" }, { name: "Hanzo", role: "Damage", id: "hanzo" },
        { name: "Junkrat", role: "Damage", id: "junkrat" }, { name: "Mei", role: "Damage", id: "mei" },
        { name: "Pharah", role: "Damage", id: "pharah" }, { name: "Reaper", role: "Damage", id: "reaper" },
        { name: "Sojourn", role: "Damage", id: "sojourn" }, { name: "Soldier: 76", role: "Damage", id: "soldier-76" },
        { name: "Sombra", role: "Damage", id: "sombra" }, { name: "Symmetra", role: "Damage", id: "symmetra" },
        { name: "Torbjörn", role: "Damage", id: "torbjorn" }, { name: "Tracer", role: "Damage", id: "tracer" },
        { name: "Venture", role: "Damage", id: "venture" }, { name: "Widowmaker", role: "Damage", id: "widowmaker" },
        { name: "Ana", role: "Support", id: "ana" }, { name: "Baptiste", role: "Support", id: "baptiste" },
        { name: "Brigitte", role: "Support", id: "brigitte" }, { name: "Illari", role: "Support", id: "illari" },
        { name: "Juno", role: "Support", id: "juno" }, { name: "Kiriko", role: "Support", id: "kiriko" },
        { name: "Lifeweaver", role: "Support", id: "lifeweaver" }, { name: "Lúcio", role: "Support", id: "lucio" },
        { name: "Mercy", role: "Support", id: "mercy" }, { name: "Moira", role: "Support", id: "moira" },
        { name: "Zenyatta", role: "Support", id: "zenyatta" }
    ];

    let currentFilter = 'All';

    function setFilter(role, btn) {
        currentFilter = role;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function pickHero() {
        const filtered = currentFilter === 'All' ? heroes : heroes.filter(h => h.role === currentFilter);
        const hero = filtered[Math.floor(Math.random() * filtered.length)];
        
        const img = document.getElementById('hero-img');
        const placeholder = document.getElementById('placeholder');
        
        document.getElementById('hero-name').innerText = hero.name;
        document.getElementById('hero-role').innerText = hero.role.toUpperCase();

        img.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.innerText = "WAITING...";

        // This is a direct URL to the official Overwatch 2 hero icons 
        // using the portrait format which is less likely to be blocked.
        const portraitUrl = `https://d15f34w2p8l1cc.cloudfront.net/overwatch/static/hero/${hero.id}/icon-portrait.png`;
        
        img.src = portraitUrl;
        
        img.onload = () => {
            img.style.display = 'block';
            placeholder.style.display = 'none';
        };

        img.onerror = () => {
            // If the official source fails, use a clean colored icon with the hero's initial
            img.style.display = 'none';
            placeholder.style.display = 'block';
            placeholder.innerText = hero.name[0];
        };
    }
</script>
</body>
</html>
